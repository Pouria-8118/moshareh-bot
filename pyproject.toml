[project]
name = "moshareh-bot"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Pouria AsnaAshari", email = "p.asnaashari2007@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "python-telegram-bot==22.8",
]

[project.scripts]
moshareh-bot = "moshareh_bot:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "workers-py>=1.17.6",
    "workers-runtime-sdk>=1.9.2",
]
